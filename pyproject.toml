[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "thrum"
version = "0.0.2"
description = "Typed operations for durable Python applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Hunter Kuffel" }
]
keywords = ["operations", "durable-execution", "background-jobs", "actors", "mcp", "framework"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

dependencies = [
  "sqlalchemy>=2.0",
  "greenlet>=3",
  "alembic>=1.13",
  "croniter>=2.0",
  "click>=8.1",
  "psycopg[binary]>=3.1",
  "asyncpg>=0.29",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
thrum = "thrum.jobs.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.4",
  "pre-commit>=3.7",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "testcontainers[postgres]>=4",
]

[project.urls]
Homepage = "https://github.com/hkuffel/thrum"
Repository = "https://github.com/hkuffel/thrum"
Issues = "https://github.com/hkuffel/thrum/issues"

[tool.hatch.build.targets.wheel]
packages = ["thrum"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
